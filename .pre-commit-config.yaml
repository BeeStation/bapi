repos:
  - repo: https://github.com/psf/black
    rev: 258e7dbf348bc23cb70b8cdf693481c04634ebcc  # frozen: 26.10.1
    hooks:
      - id: black

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: debug-statements
        language_version: python3

  - repo: https://github.com/PyCQA/flake8
    rev: 960c1d286190804104f7255b97da034446fdaac3  # frozen: 7.5.0
    hooks:
      - id: flake8
        language_version: python3

  - repo: https://github.com/asottile/reorder-python-imports
    rev: 4690733311bbfba33558e4d50a7f0092c64d78d8  # frozen: v3.19.0
    hooks:
      - id: reorder-python-imports

  - repo: https://github.com/codespell-project/codespell
    rev: 57b21406f092110c18776e39b0bda50d37c945c8  # frozen: v2.4.3
    hooks:
    - id: codespell
      additional_dependencies:
      - tomli

  -   repo: https://github.com/pre-commit/mirrors-mypy
      rev: ad26ebfa797fcb9b8f83275937c1c1d6e126719c  # frozen: v2.4.1
      hooks:
      -   id: mypy
          additional_dependencies:
            - "types-PyYAML"
            - "types-cachetools"
            - "types-requests"
